
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Photo Gallery</title>
    <link rel="stylesheet" href="css/gallery.css">
    <script src="js/gallery.js" defer></script>
</head>
<body onload="addTabindex()">

    <h1>Interactive Photo Gallery</h1>

    <div id="image">
        Hover over an image below to display here.
    </div>

    <div class="gallery">

        <img class="preview"
             src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=600"
             alt="A beautiful blue lake surrounded by tall mountains"
             onmouseover="upDate(this)"
             onmouseout="unDo()"
             onfocus="upDate(this)"
             onblur="unDo()">

        <img class="preview"
             src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600"
             alt="Sunlight shining through tall green trees in a forest"
             onmouseover="upDate(this)"
             onmouseout="unDo()"
             onfocus="upDate(this)"
             onblur="unDo()">

        <img class="preview"
             src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600"
             alt="A scenic natural landscape with beautiful open views"
             onmouseover="upDate(this)"
             onmouseout="unDo()"
             onfocus="upDate(this)"
             onblur="unDo()">

        <img class="preview"
             src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600"
             alt="A peaceful lake surrounded by green mountains"
             onmouseover="upDate(this)"
             onmouseout="unDo()"
             onfocus="upDate(this)"
             onblur="unDo()">

        <img class="preview"
             src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=600"
             alt="Sunrise illuminating a green countryside landscape"
             onmouseover="upDate(this)"
             onmouseout="unDo()"
             onfocus="upDate(this)"
             onblur="unDo()">

        <img class="preview"
             src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600"
             alt="Tall mountain peaks rising beneath the sky"
             onmouseover="upDate(this)"
             onmouseout="unDo()"
             onfocus="upDate(this)"
             onblur="unDo()">

    </div>

</body>
</html>
